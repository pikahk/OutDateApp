services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: outdate
      POSTGRES_USER: outdate
      POSTGRES_PASSWORD: outdate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

  mail:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  db-data:
