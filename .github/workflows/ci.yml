name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE: ghcr.io/pikahk/outdate-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build, check code style and run tests
        run: ./gradlew build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for server changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- server deploy gradle .github; then
            echo "server=false" >> "$GITHUB_OUTPUT"
          else
            echo "server=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build server image
        if: steps.changes.outputs.server == 'true'
        run: docker build --file server/Dockerfile --tag "$IMAGE:latest" --tag "$IMAGE:$GITHUB_SHA" .

      - name: Push image to GitHub Container Registry
        if: steps.changes.outputs.server == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Update server
        if: steps.changes.outputs.server == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key"
            exit 1
          fi
          printf '%s' "$GITHUB_TOKEN" | ssh -i ~/.ssh/deploy_key "root@$DEPLOY_HOST"

      - name: Check that server responds
        if: steps.changes.outputs.server == 'true'
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://api.outdateapp.ru/health
